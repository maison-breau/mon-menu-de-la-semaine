.portion-buttons{display:flex;align-items:center;gap:12px}.portion-buttons strong{font-size:1.4rem;min-width:24px;text-align:center}

.ingredient-quantity{color:#a14c28;font-weight:800}.inline-actions{display:flex;align-items:center;gap:3px;flex-shrink:0}.hash-peek{border-color:#f7c28c;background:#fff0db;color:#91440d;font-weight:900}.peek-hint{position:absolute;z-index:4;background:#fff1d9;border:1px solid #edbd80;border-radius:8px;padding:7px 10px;box-shadow:0 5px 17px #5b341444;max-width:250px;font-size:.79rem}.alt-picker{border:1px dashed #ead0b5;border-radius:12px;padding:12px;margin:13px 0}.tm-settings{font-size:.79rem;font-weight:750;background:#edf6fb;color:#20638f;padding:6px 8px;border-radius:7px;margin-top:5px}.recipe-note{background:#fff7ec;border-left:3px solid #e6a65a;padding:8px 12px}.meal small{display:block;margin:2px 0 6px}.header-actions{flex-wrap:wrap;justify-content:flex-end}

.recipe-list{display:grid;gap:8px}.recipe-list-item{display:flex;gap:12px;align-items:center;padding:10px 12px;min-width:0}.recipe-list-thumb{width:68px;height:60px;flex:none;border-radius:10px;overflow:hidden}.recipe-list-thumb .photo{height:60px;font-size:1.7rem}.recipe-list-content{flex:1;min-width:0}.recipe-list-content .title-link{font-size:.95rem}.recipe-list-content .badge-row{margin-top:5px}.recipe-list-actions{display:flex;gap:6px;align-items:center}.recipe-list-actions .btn{white-space:nowrap}@media(max-width:570px){.recipe-list-item{gap:9px;padding:9px}.recipe-list-thumb{width:52px;height:52px}.recipe-list-thumb .photo{height:52px}.recipe-list-actions .btn{padding:6px 8px;font-size:.76rem}.recipe-list-content .badge-row .stars,.recipe-list-content .badge-row .tag:not(:first-child){display:none}}

.week-grid{grid-template-columns:1fr!important}.logo{background:transparent;box-shadow:none}.header-actions .status{max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

function freezerEdit(id){

 freezerData={version:1,lots};freezerSave();toast('Inventaire importé.');
 }catch(err){alert('Import impossible : '+err.message)}
}

function combineQuantities(vals){const groups=new Map(),loose=[];for(const raw of vals.filter(Boolean)){const s=String(raw).trim();const m=s.match(/^(\d+(?:[.,]\d+)?)\s*(g|gr|kg|ml|cl|l|pièces?|pcs|tranches?|càs|càc|brins?|pincées?|sachets?|cubes?|gousses?|c\.\s*à\s*s\.|c\.\s*à\s*c\.)?$/i);if(m){const k=norm(m[2]||'unités');groups.set(k,(groups.get(k)||0)+Number(m[1].replace(',','.')))}else if(!loose.includes(s))loose.push(s)}return [...[...groups].map(([unit,n])=>`${Number(n.toFixed(2))}${unit==='unités'?'':` ${unit}`}`),...loose].join(' + ')}
function dedupIngredients(rs){const m=new Map();for(const r of rs)for(const ing of ingredientArray(r)){if(!ing?.name)continue;const k=norm(ing.name);if(!m.has(k))m.set(k,{name:ing.name,quantities:[]});if(ing.qty)m.get(k).quantities.push(ing.qty)}return [...m.values()].sort((a,b)=>a.name.localeCompare(b.name,'fr')).map(x=>({name:x.name,qty:combineQuantities(x.quantities)}))}

function addSources(ids){const sh=state.shopping;for(const id of ids){const r=recipe(id);if(!r)continue;if(!sh.recipeIds.includes(id))sh.recipeIds.push(id);const names=new Set(ingredientArray(r).map(x=>norm(x.name)));sh.excluded=sh.excluded.filter(x=>!names.has(x))}rebuildShopping();commit('Ingrédients ajoutés à votre liste de courses.')}
function addManual(){const name=$('#shop-name').value.trim(),qty=$('#shop-qty').value.trim();if(!name)return;const sh=state.shopping,k=norm(name);sh.excluded=sh.excluded.filter(x=>x!==k);let item=sh.items.find(x=>norm(x.name)===k);if(item){item.manual=true;item.manualQty=combineQuantities([item.manualQty,qty]);item.checked=false}else sh.items.push({id:uid(),name,qty,checked:false,manual:true,manualQty:qty,order:Math.max(0,...sh.items.map(x=>Number(x.order)||0))+1,sources:[],sourceQtys:[]});rebuildShopping();commit('Article ajouté à la liste.')}
function shoppingRow(x){return `<div class="shopping-row ${x.checked?'checked':''}"><input type="checkbox" data-action="toggle-item" data-id="${e(x.id)}" ${x.checked?'checked':''} aria-label="${e(x.name)}"><span class="shopping-name">${e(x.name)}${x.qty?`<span class="shopping-qty">${e(x.qty)}</span>`:''}</span><button class="mini-action" data-action="delete-item" data-id="${e(x.id)}" title="Retirer l’article">✕</button></div>`}
function groupedShop(items){const a=[...items];if(shopSort==='name')a.sort((x,y)=>x.name.localeCompare(y.name,'fr'));else if(shopSort==='added')a.sort((x,y)=>(x.order||0)-(y.order||0));else a.sort((x,y)=>AISLES.indexOf(aisle(x.name))-AISLES.indexOf(aisle(y.name))||x.name.localeCompare(y.name,'fr'));
 if(shopSort!=='category')return `<div class="card">${a.map(shoppingRow).join('')}</div>`;
 return AISLES.map(cat=>{const sub=a.filter(i=>aisle(i.name)===cat);return sub.length?`<div class="aisle"><div class="aisle-label">${e(cat)} <small>(${sub.length})</small></div><div class="card">${sub.map(shoppingRow).join('')}</div></div>`:''}).join('')}
let shopView='single',selectedShopWeek=0;
function shoppingWeeks(){const first=iso(monday(new Date()));let last=first;for(const d of Object.keys(state.planning))if(d>last)last=d;const count=Math.max(4,Math.min(28,Math.ceil((dateDays(first,last)+1)/7)));return Array.from({length:count},(_,i)=>shiftDate(first,i*7))}
function weeklyShoppingItems(base){const end=shiftDate(base,6),map=new Map(),manual=state.shopping.weeklyManual?.[base]||[];for(const [day,pl] of Object.entries(state.planning)){if(day<base||day>end)continue;for(const slot of ['midi','soir']){const r=recipe(pl[slot]);if(!r)continue;for(const it of ingredientsFor(r,mealServing(day,slot,r))){const key=norm(it.name);if(!key)continue;if(!map.has(key))map.set(key,{name:it.name,values:[]});if(it.qty)map.get(key).values.push(it.qty)}}}for(let d=base;d<=end;d=shiftDate(d,1)){for(const it of extraIngredientsForDay(d)){const key=norm(it.name);if(!key)continue;if(!map.has(key))map.set(key,{name:it.name,values:[]});if(it.qty)map.get(key).values.push(it.qty)}}for(const m of manual){const key=norm(m.name);if(!map.has(key))map.set(key,{name:m.name,values:[]});if(m.qty)map.get(key).values.push(m.qty)}return [...map].map(([key,val])=>({id:base+'|'+key,name:val.name,qty:combineQuantities(val.values),checked:!!state.shopping.weekChecks?.[base+'|'+key]})).sort((a,b)=>shopSort==='name'?a.name.localeCompare(b.name,'fr'):AISLES.indexOf(aisle(a.name))-AISLES.indexOf(aisle(b.name))||a.name.localeCompare(b.name,'fr'))}
function weeklyShopBlock(base,heading=true){const items=weeklyShoppingItems(base);return `<section class="card" style="padding:14px;margin-bottom:14px">${heading?`<h3>📅 ${e(displayPeriod(base))}</h3>`:''}<div class="stat-row">${items.length} article(s)</div>${items.length?items.map(it=>`<div class="shopping-row ${it.checked?'checked':''}"><input type="checkbox" data-week-check="${e(it.id)}" ${it.checked?'checked':''}><span class="shopping-name">${e(it.name)} <small>${e(it.qty)}</small></span></div>`).join(''):empty('Aucun repas ou article prévu pour cette semaine.','🛒')}</section>`}
function renderShopping(){const weeks=shoppingWeeks();selectedShopWeek=Math.min(selectedShopWeek,weeks.length-1);const base=weeks[selectedShopWeek],range=shopView==='single'?[base]:weeks;let html=`<div class="section-head"><div><div class="eyebrow">Le panier</div><h2>Ma liste de courses</h2><p class="section-sub">Les ingrédients sont mis à jour automatiquement depuis le planning.</p></div></div><div class="card form-card"><div class="field"><label>Affichage</label><select id="shop-view"><option value="single" ${shopView==='single'?'selected':''}>Une semaine précise</option><option value="separate" ${shopView==='separate'?'selected':''}>Chaque semaine séparément</option><option value="all" ${shopView==='all'?'selected':''}>Toutes les semaines regroupées</option></select></div>${shopView==='single'?`<div class="field"><label>Choisir la semaine</label><select id="shop-week">${weeks.map((d,i)=>`<option value="${i}" ${i===selectedShopWeek?'selected':''}>${e(displayPeriod(d))}</option>`).join('')}</select></div>`:''}<div class="field"><label>Trier par</label><select id="shopping-sort"><option value="category" ${shopSort==='category'?'selected':''}>Rayons</option><option value="name" ${shopSort==='name'?'selected':''}>Ordre alphabétique</option></select></div><div class="form-inline"><input id="shop-name" placeholder="Ajouter un article…"><input id="shop-qty" placeholder="Quantité (facultatif)"><button class="btn btn-primary" data-action="week-manual">＋ Ajouter</button></div><p class="hint">Les articles ajoutés manuellement sont enregistrés dans la semaine sélectionnée${shopView==='single'?'': ' (ou la première semaine)' }.</p></div>`;
if(shopView==='all'){const all=new Map();for(const w of weeks)for(const it of weeklyShoppingItems(w)){const k=norm(it.name);if(!all.has(k))all.set(k,{name:it.name,vals:[]});if(it.qty)all.get(k).vals.push(it.qty)}html+=`<section class="card" style="padding:16px"><h3>🛒 Toutes les semaines regroupées</h3>${[...all.values()].sort((a,b)=>a.name.localeCompare(b.name,'fr')).map(it=>`<div class="shopping-row"><span class="shopping-name">${e(it.name)}</span><small>${e(combineQuantities(it.vals))}</small></div>`).join('')||empty('Aucun article.')}</section>`}else html+=range.map(w=>weeklyShopBlock(w)).join('');html+=`<div class="toolbar" style="margin-top:16px"><button class="btn" data-action="print-shop">🖨️ Imprimer</button><button class="btn" data-action="mail-shop">✉️ Envoyer par mail</button><button class="btn" data-action="share-shop">📱 Partager</button></div>`;$('#view').innerHTML=html}

top:20px"><button class="btn btn-danger" data-action="caddie-clear">✓ Effacer les produits achetés</button></div><p class="hint" style="margin-top:12px">Version de test : vos changements sont enregistrés dans ce navigateur, sans synchronisation familiale. Les recettes et le planning proviennent de votre application actuelle.</p>`;

 filterPast();$('#ingredient-search').addEventListener('input',ev=>{ingredientQuery=ev.target.value;filterPast()})}

function renderSuggestions(){const scores=state.recipes.map(r=>{const last=lastRecipeDay(r.id),days=last?Math.min(30,dateDays(last,today())):30;return {r,last,days,score:(Number(r.favorite)||0)*5+days}}).sort((a,b)=>b.score-a.score||(Number(b.r.favorite)||0)-(Number(a.r.favorite)||0)||a.r.title.localeCompare(b.r.title,'fr')).slice(0,6);$('#view').innerHTML=`<div class="section-head"><div><div class="eyebrow">À redécouvrir</div><h2>Suggestions du chef</h2><p class="section-sub">Le classement valorise vos favoris et les recettes cuisinées il y a longtemps.</p></div></div><div class="stat-row"><span class="stat-pill">Score = étoiles × 5 + jours depuis le dernier repas (max. 30)</span></div>${scores.length?`<div class="suggest-grid">${scores.map(({r,last,days,score},i)=>`<article class="card recipe-card rank-card"><div style="position:relative">${photo(r)}<span class="rank">${i+1}</span></div><div class="recipe-body"><button class="title-link" data-action="detail" data-id="${e(r.id)}">${e(r.title)}</button>${badges(r)}<div class="badge-row"><span class="tag">${last?`Dernière fois : ${days} jour${days>1?'s':''}`:'Jamais planifiée'}</span><span class="tag">Score ${score}</span></div>${chipList(ingredientArray(r),8)}<div class="recipe-footer"><button class="btn btn-mini btn-primary" data-action="suggest-slot" data-id="${e(r.id)}" data-slot="midi">☀️ Midi aujourd’hui</button><button class="btn btn-mini btn-primary" data-action="suggest-slot" data-id="${e(r.id)}" data-slot="soir">🌙 Soir aujourd’hui</button></div></div></article>`).join('')}</div>`:empty('Ajoutez quelques recettes pour obtenir des suggestions.','✨')}`}
function settingsDialog(){openModal('<h2>🔧 Paramètres</h2>',`<div class="toolbar" style="display:grid;gap:10px"><button class="btn" id="settings-drive" type="button">☁️ ${e(driveConnected?'Drive connecté — gérer':'Connecter Google Drive')}</button><button class="btn" data-action="grok-sync">↻ Synchroniser les recettes Grok</button><button class="btn" data-action="grok-local">📂 Importer des PDF / JSON</button><button class="btn" data-action="import-json">⬆ Restaurer une sauvegarde</button><button class="btn" data-action="export-json">⬇ Télécharger une sauvegarde JSON</button></div><p class="hint">Un indicateur de sauvegarde reste visible sur ordinateur. Les recettes originales de Grok ne sont jamais modifiées.</p>`, '<button class="btn" data-action="modal-close">Fermer</button>');$('#settings-drive').addEventListener('click',()=>{closeModal();driveDialog()})}
function exportJson(){const out={_comment:'Mon Menu de la Semaine — export de l’application',version:4,updatedAt:state.updatedAt,recipes:state.recipes,plan:state.planning,planning:state.planning,mealPortions:state.mealPortions,dayExtras:state.dayExtras,shopping:state.shopping};const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='donnees-menu-semaine.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Sauvegarde JSON téléchargée. Déposez-la sur Drive pour la partager.')}
function importJson(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(String(reader.result));if(!Array.isArray(d.recipes))throw Error('invalid');if(!confirm(`Importer ${d.recipes.length} recettes ? Vos recettes, votre planning et votre liste actuels seront remplacés par les données du fichier. Pensez à exporter une sauvegarde avant.`))return;state=hydrate(d);rebuildShopping();commit(`${state.recipes.length} recettes importées.`)}catch{toast('Fichier invalide : JSON attendu avec une liste « recipes ».')}};reader.readAsText(file,'utf-8')}
function handleAction(b){const a=b.dataset.action,id=b.dataset.id,day=b.dataset.date,slot=b.dataset.slot;
 if(a==='caddie-open'||a==='caddie-basket'){tab=a==='caddie-open'?'shopping':'basket';render();return}
 if(a==='caddie-add'){caddieAdd($('#caddie-name')?.value,$('#caddie-qty')?.value);return}
 if(a==='caddie-suggest'){caddieAdd(b.dataset.name);return}
 if(a==='caddie-delete'){caddieState.manual=caddieState.manual.filter(x=>x.id!==id);caddieSave();renderCaddie();return}
 if(a==='caddie-clear'){caddieClear();return}
 if(a==='zoom-logo'){const img=$('.brand .logo img');if(img)openModal('<h2>Mon Menu de la Semaine</h2>',`<div class="logo-viewer"><img class="logo-enlarge" src="${img.src}" alt="Logo Mon Menu de la Semaine"></div>`)}else if(a==='rate-recipe'){const r=recipe(id);if(r){r.favorite=Math.max(0,Math.min(5,Number(b.dataset.rating)||0));commit('Note enregistrée.')}}else if(a==='open-settings'){settingsDialog()}else if(a==='auto-four-weeks'){generateFourWeeks()}else if(a==='extend-days'){state.planningDays=Math.min(180,(state.planningDays||28)+1);commit('Une journée supplémentaire ajoutée.')}else if(a==='prev-week'){weekOffset--;renderWeek()}else if(a==='next-week'){weekOffset++;renderWeek()}else if(a==='today-week'){weekOffset=0;renderWeek()}
 else if(a==='extra-add'||a==='extra-edit'){extraDialog(day,a==='extra-edit'?id:'')}
 else if(a==='extra-remove'){state.dayExtras[day]=(state.dayExtras?.[day]||[]).filter(x=>x.id!==id);commit('Élément retiré de la journée.')}
 else if(a==='pick-plan'){recipeSelector(`${b.dataset.mode==='insert'?'Insérer':'Choisir'} une recette · ${slot} · ${fmt(day)}`,rid=>setPlan(day,slot,rid,b.dataset.mode==='insert'))}
 else if(a==='clear-plan')clearPlan(day,slot);
 else if(a==='detail')detail(id,day,slot);else if(a==='new-recipe')editor();else if(a==='edit-recipe')editor(id);else if(a==='save-recipe')saveRecipe(id||null);else if(a==='delete-recipe')deleteRecipe(id);
 else if(a==='modal-close')closeModal();else if(a==='selected-recipe'){const cb=modalSelection;closeModal();if(cb)cb(id)}
 else if(a==='clear-recipe-search'){query='';renderRecipes()}
 else if(a==='recipe-view-grid'||a==='recipe-view-list'){recipeView=a==='recipe-view-list'?'list':'grid';localStorage.setItem('menu-recipe-view',recipeView);renderRecipeList()}
 else if(a==='shopping-pick')recipeSelector('Ajouter une recette aux courses',rid=>addSources([rid]));
 else if(a==='shopping-week'){const base=weekBase(),end=shiftDate(base,6),ids=Object.entries(state.planning).filter(([d])=>d>=base&&d<=end).flatMap(([,pl])=>[pl.midi,pl.soir]).filter(Boolean);if(!ids.length)toast('Aucun repas planifié sur cette semaine.');else{state.shopping.weekBase=base;state.shopping.recipeIds=[];rebuildShopping();commit('Courses de la semaine calculées selon les parts.')}}
 else if(a==='manual-item')addManual();else if(a==='week-manual')addWeeklyManual();else if(a==='remove-source'){state.shopping.recipeIds=state.shopping.recipeIds.filter(v=>v!==id);rebuildShopping();commit('Recette retirée de la liste.')}else if(a==='delete-item'){const x=state.shopping.items.find(x=>x.id===id);if(x){state.shopping.items=state.shopping.items.filter(v=>v.id!==id);if(x.sources?.length)state.shopping.excluded.push(norm(x.name));rebuildShopping();commit('Article retiré.')}}
 else if(a==='clean-shop'){const n=state.shopping.items.filter(x=>x.checked);if(!n.length)return toast('Aucun article coché.');state.shopping.items=state.shopping.items.filter(x=>!x.checked);state.shopping.excluded.push(...n.filter(x=>x.sources?.length).map(x=>norm(x.name)));rebuildShopping();commit(`${n.length} article(s) nettoyé(s).`)}
 else if(a==='print-shop')printShopping();else if(a==='mail-shop'){location.href=`mailto:?subject=${encodeURIComponent('Ma liste de courses')}&body=${encodeURIComponent(shopText())}`}
 else if(a==='grok-sync'){if(!driveConnected)driveDialog();else grokSync(false)}
 else if(a==='grok-local')$('#grok-file-input').click();
 else if(a==='parts-inc'||a==='parts-dec'){const r=recipe(id);if(r)detail(id,day,slot,Math.max(1,Math.min(30,(Number(b.dataset.parts)||1)+(a==='parts-inc'?1:-1))))}
 else if(a==='save-parts'){const r=recipe(id);if(r&&day&&slot){state.mealPortions[day]??={};state.mealPortions[day][slot]=Math.max(1,Number(b.dataset.parts)||1);commit('Nombre de parts enregistré pour ce repas.');detail(id,day,slot,Number(b.dataset.parts)||1)}}
 else if(a==='add-ingredient')addGrokIngredient(id,day,slot,Number(b.dataset.parts));
 else if(a==='remove-ingredient')removeGrokIngredient(id,b.dataset.ingredient,day,slot,Number(b.dataset.parts));
 else if(a==='edit-ingredient')editGrokIngredient(id,b.dataset.ingredient,day,slot,Number(b.dataset.parts));
 else if(a==='edit-step')editGrokStep(id,b.dataset.step,day,slot,Number(b.dataset.parts));
 else if(a==='add-note')addGrokNote(id,day,slot,Number(b.dataset.parts));
 else if(a==='choose-alternative')chooseAlternative(id,b.dataset.group,b.dataset.choice,day,slot,Number(b.dataset.parts));
 else if(a==='drive-login')driveRequestToken();else if(a==='share-shop')shareShopping();else if(a==='export-json')exportJson();else if(a==='import-json')$('#json-file').click();
 else if(a==='suggest-slot'){const d=today();if(state.planning[d]?.[slot]&&!confirm(`Remplacer le repas déjà prévu pour ${slot} aujourd’hui ?`))return;setPlan(d,slot,id);tab='week';weekOffset=0;render()}}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(b&&b.dataset.action?.startsWith('freezer-')){ev.preventDefault();const a=b.dataset.action,id=b.dataset.id;if(a==='freezer-add'||a==='freezer-edit')freezerEdit(id);else if(a==='freezer-export')freezerExport();else if(a==='freezer-import')$('#freezer-file').click();else if(a==='freezer-minus'){const lot=freezerData.lots.find(x=>x.id===id);if(lot&&lot.quantite>0&&confirm('Retirer une unité de '+lot.nom+' ?')){lot.quantite--;lot.historique??=[];lot.historique.push({action:'retrait',quantite:1,date:new Date().toISOString(),source:'manuel'});freezerSave()}}return}const b2=null;if(b){if(b.matches('input[type=checkbox]'))return;ev.preventDefault();handleAction(b);return}if(ev.target.classList.contains('modal-wrap'))closeModal();const t=ev.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render();$('#view').focus({preventScroll:true})}});
document.addEventListener('change',ev=>{
 if(ev.target.id==='basket-period'){basketPeriod=ev.target.value;renderBasket();return}
 if(ev.target.id==='basket-week'){basketWeek=Number(ev.target.value);renderBasket();return}
 if(ev.target.matches('[data-basket-id]')){caddieState.selected[ev.target.dataset.basketId]=ev.target.checked;caddieSave();renderBasket();return}
 if(ev.target.matches('[data-caddie-check]')){caddieState.done[ev.target.dataset.caddieCheck]=ev.target.checked;caddieSave();renderCaddie();return}if(ev.target.id==='freezer-file'){freezerImport(ev.target.files?.[0]);ev.target.value='';return}if(ev.target.id==='freezer-category'){freezerFilter=ev.target.value;renderFreezer();return}if(ev.target.id==='freezer-zero'){freezerShowZero=ev.target.checked;renderFreezer();return}if(ev.target.id==='recipe-sort'){recipeSort=ev.target.value;localStorage.setItem('menu-recipe-sort',recipeSort);renderRecipeList()}else if(ev.target.id==='recipe-category'){recipeCategory=ev.target.value;localStorage.setItem('menu-recipe-category',recipeCategory);renderRecipeList()}else if(ev.target.id==='shop-view'){shopView=ev.target.value;renderShopping()}else if(ev.target.id==='shop-week'){selectedShopWeek=Number(ev.target.value);renderShopping()}else if(ev.target.matches('[data-week-check]')){state.shopping.weekChecks??={};state.shopping.weekChecks[ev.target.dataset.weekCheck]=ev.target.checked;commit('Courses mises à jour.')}else if(ev.target.id==='shopping-sort'){shopSort=ev.target.value;renderShopping()}else if(ev.target.matches('[data-action="toggle-item"]')){const x=state.shopping.items.find(i=>i.id===ev.target.dataset.id);if(x){x.checked=ev.target.checked;commit(x.checked?'Article coché.':'Article décoché.')}}else if(ev.target.id==='json-file'){importJson(ev.target.files?.[0]);ev.target.value=''}else if(ev.target.id==='grok-file-input'){importGrokFiles([...ev.target.files]);ev.target.value=''}});
document.addEventListener('input',ev=>{if(ev.target.id==='freezer-search'){freezerSearch=ev.target.value;const pos=ev.target.selectionStart;renderFreezer();const el=$('#freezer-search');el.focus();el.setSelectionRange(pos,pos);return}if(ev.target.id==='recipe-search'){query=ev.target.value;renderRecipeList()}});
// Bandeau mobile : deux seuils distincts evitent les boucles de mise en page.
// Ne pas basculer selon la direction instantanee : la reduction de hauteur
// modifie elle-meme scrollY et faisait clignoter le bandeau.
window.addEventListener('scroll',()=>{
  const bar=$('.topbar');if(!bar)return;
  if(!window.matchMedia('(max-width:650px)').matches){bar.classList.remove('is-compact');return}
  const y=window.scrollY;
  if(!bar.classList.contains('is-compact')&&y>=200)bar.classList.add('is-compact');
  else if(bar.classList.contains('is-compact')&&y<=35)bar.classList.remove('is-compact');
},{passive:true});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&$('#modal-host').children.length)closeModal();if(ev.key==='Enter'&&(ev.target.id==='shop-name'||ev.target.id==='shop-qty')){ev.preventDefault();addWeeklyManual()}});
let dragged='';document.addEventListener('dragstart',ev=>{const day=ev.target.closest('.day-card');if(!day)return;dragged=day.dataset.date;ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',dragged)});document.addEventListener('dragover',ev=>{const el=ev.target.closest('.day-card');if(!el||!dragged)return;ev.preventDefault();$$('.day-card').forEach(x=>x.classList.remove('drag-over'));if(el.dataset.date!==dragged)el.classList.add('drag-over')});document.addEventListener('drop',ev=>{const el=ev.target.closest('.day-card');if(!el||!dragged)return;ev.preventDefault();const dst=el.dataset.date;$$('.day-card').forEach(x=>x.classList.remove('drag-over'));const src=dragged;dragged='';swapDays(src,dst)});document.addEventListener('dragend',()=>{dragged='';$$('.day-card').forEach(x=>x.classList.remove('drag-over'))});
window.addEventListener('error',ev=>{if(ev.target?.classList?.contains('recipe-img'))ev.target.style.display='none'},true);
rebuildShopping();render();
})();
</script>

if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
 window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Service worker non enregistré :',err)));
}
