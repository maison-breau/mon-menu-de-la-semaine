<body>
<div id="app">
<header class="topbar">
 <div class="container top-inner">
  <div class="brand"><div class="logo" aria-hidden="true">🍽️</div><div><h1>Mon Menu de la Semaine</h1><small>De bonnes idées dans votre assiette</small></div></div>
  <div class="header-actions"><span class="status" id="save-status">● Enregistré localement</span><button class="btn btn-mini btn-soft" id="drive-connect" type="button">☁️ Connecter Drive</button><button class="btn btn-mini" data-action="import-json" title="Importer les recettes depuis un fichier JSON">⬆ Importer</button><button class="btn btn-mini" data-action="export-json" title="Télécharger une sauvegarde JSON">⬇ JSON</button></div>
 </div>
 <nav class="container nav" aria-label="Navigation principale">
  <button class="tab active" data-tab="week">📅 Ma semaine</button><button class="tab" data-tab="recipes">📖 Mes recettes</button><button class="tab" data-tab="shopping">🛒 Ma liste de courses</button><button class="tab" data-tab="history">🥕 Ingrédients</button><button class="tab" data-tab="suggestions">✨ Suggestions</button>
 </nav>
</header>
<main id="view" class="container main" tabindex="-1"></main>
<footer class="footer">Mon Menu de la Semaine · Les données restent locales tant que Drive n’est pas connecté. · <a href="https://drive.google.com/drive/folders/1lrmfx_QgqnZDrLk5VanVeX96--jojxTO" target="_blank" rel="noopener noreferrer">Dossier Recettes sur Drive ↗</a></footer>
<input type="file" id="json-file" class="sr-only" accept=".json,application/json">
</div>
<div id="modal-host"></div><div class="toast-stack" id="toast-stack" aria-live="polite"></div><div class="print-only" id="print-area"></div>
<script id="seed-data" type="application/json">{"recipes": [], "plan": {}}</script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
'use strict';
(()=>{
const STORAGE_KEY='menu-semaine-data-v4';
const OAUTH_CLIENT_ID='270998979037-ssq1s3rtk4rsuq4jrndk7rcp2370jq1n.apps.googleusercontent.com';
const DRIVE_SCOPE='https://www.googleapis.com/auth/drive.file';
const DRIVE_FILE_KEY='menu-semaine-drive-file-v1';
const CATEGORIES=['Apéro','Entrée','Plat','Dessert','Petit-déjeuner','Gâteau','Autre'];
const AISLES=['Fruits & légumes','Boucherie & poissonnerie','Crèmerie & œufs','Épicerie salée','Épicerie sucrée','Surgelés','Autre'];
const WEEKDAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const months=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const $=(sel,root=document)=>root.querySelector(sel), $$=(sel,root=document)=>[...root.querySelectorAll(sel)];
const e=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=(s)=>String(s||'').trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ');
const safeUrl=(u)=>{try{const v=new URL(u);return ['https:','http:'].includes(v.protocol)?v.href:''}catch{return ''}};
const uid=()=>`r-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`;
const iso=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fromIso=(x)=>{const[a,b,c]=String(x).split('-').map(Number);return new Date(a,b-1,c)};
const shiftDate=(str,days)=>{const d=fromIso(str);d.setDate(d.getDate()+days);return iso(d)};
const today=()=>iso(new Date());
const fmt=(s,opt={day:'numeric',month:'long'})=>fromIso(s).toLocaleDateString('fr-FR',opt);
const monday=(d)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const dateDays=(a,b)=>Math.round((fromIso(b)-fromIso(a))/(86400000));
const niceSteps=(s)=>Array.isArray(s)?s.map(x=>typeof x==='string'?x:JSON.stringify(x)).filter(Boolean):String(s||'').split(/\r?\n/).filter(Boolean);
const ingredientArray=(r)=>Array.isArray(r?.ingredients)?r.ingredients:[];
const seed=JSON.parse($('#seed-data').textContent);
function hydrate(o){
 const data=o&&typeof o==='object'?o:{};
 const sh=data.shopping||data.shoppingList||{};
 return {version:4,recipes:Array.isArray(data.recipes)?data.recipes.filter(x=>x&&x.id&&x.title):[],planning:(data.planning&&typeof data.planning==='object'?data.planning:(data.plan&&typeof data.plan==='object'?data.plan:{})),shopping:{items:Array.isArray(sh.items)?sh.items:[],recipeIds:Array.isArray(sh.recipeIds)?sh.recipeIds:[],excluded:Array.isArray(sh.excluded)?sh.excluded:[]},updatedAt:Number(data.updatedAt)||0};
}
let stored=null;
try{stored=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')}catch{}
let state=hydrate(stored||seed);let weekOffset=0,tab='week',query='',ingredientQuery='',shopSort='category',apiOnline=false,saveTimer=null,storageWarningShown=false;
const hasLocal=!!stored;
let driveToken='',driveFileId=localStorage.getItem(DRIVE_FILE_KEY)||'',driveBusy=false,driveDirty=false,driveTimer=null,driveLastVersion=0,driveConnected=false;
const driveButton=$('#drive-connect');
function driveStatus(message){$('#save-status').textContent=message;}
function driveDialog(){
 const current=driveFileId?`Fichier lié : ${driveFileId}`:'Aucun fichier Drive lié sur cet appareil.';
 openModal('<h2>☁️ Synchronisation Google Drive</h2>',`<p>Connectez-vous au compte Google qui possède le fichier de données. Pour un autre appareil, saisissez le même identifiant de fichier.</p><p class="muted">${e(current)}</p><div class="field"><label for="drive-file-input">Identifiant du fichier Drive partagé (facultatif)</label><input id="drive-file-input" value="${e(driveFileId)}" placeholder="Collez l’identifiant du fichier ici"></div><p class="form-help">Le premier appareil crée un fichier. Pour les autres appareils, récupérez son identifiant ici. Ne publiez pas cet identifiant sur GitHub.</p><p class="form-help">Version initiale : utilisez le même compte Google sur les appareils. L’accès avec plusieurs comptes familiaux nécessite une configuration supplémentaire des autorisations.</p>`, `<button class="btn" data-action="modal-close">Annuler</button><button class="btn btn-primary" data-action="drive-login">Se connecter</button>`);
}
function driveRequestToken(){
 if(!window.google?.accounts?.oauth2){toast('Connexion Google en cours de chargement. Réessayez dans quelques secondes.');return}
 const candidate=$('#drive-file-input')?.value.trim()||'';
 if(candidate&&!/^[a-zA-Z0-9_-]{15,}$/.test(candidate)){toast('Identifiant de fichier Drive invalide.');return}
 if(candidate){driveFileId=candidate;localStorage.setItem(DRIVE_FILE_KEY,candidate)}
 const client=google.accounts.oauth2.initTokenClient({client_id:OAUTH_CLIENT_ID,scope:DRIVE_SCOPE,callback:async response=>{
  if(response.error||!response.access_token){toast('Connexion Google annulée ou refusée.');return}
  driveToken=response.access_token;closeModal();try{await driveInitialize()}catch(err){driveStatus('⚠ Drive non connecté');toast('Drive : '+err.message)}
 }});
 client.requestAccessToken({prompt:'consent'});
}
async function driveFetch(url,options={}){
 const resp=await fetch(url,{...options,headers:{Authorization:'Bearer '+driveToken,...(options.headers||{})}});
 if(resp.status===401){driveConnected=false;driveStatus('⚠ Reconnexion Google nécessaire');throw Error('Session expirée. Reconnectez Google Drive.')}
 if(!resp.ok){let detail='';try{detail=(await resp.json()).error?.message||''}catch{}throw Error(detail||'Erreur Google Drive ('+resp.status+')')}
 return resp;
}
async function driveRead(){
 const res=await driveFetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(driveFileId)+'?alt=media&fields=id',{cache:'no-store'});
 return hydrate(await res.json());
}
async function driveWrite(){
 const body=JSON.stringify(state);
 await driveFetch('https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(driveFileId)+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body});
 driveLastVersion=state.updatedAt;driveDirty=false;driveStatus('☁️ Synchronisé avec Drive');
}
async function driveInitialize(){
 driveBusy=true;
 try{
  if(!driveFileId){
   const metadata={name:'Mon Menu de la Semaine - Données privées.json',mimeType:'application/json',description:'Données privées de Mon Menu de la Semaine'};
   const created=await (await driveFetch('https://www.googleapis.com/drive/v3/files?fields=id,name',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(metadata)})).json();
   driveFileId=created.id;localStorage.setItem(DRIVE_FILE_KEY,driveFileId);
   if(!state.recipes.length){toast('Fichier Drive créé. Importez votre sauvegarde JSON pour retrouver les recettes.')}

};
function aisle(name){const n=norm(name);for(const cat of AISLES){if((rules[cat]||[]).some(k=>n.includes(norm(k))))return cat}return 'Autre'}
function rebuildShopping(){const sh=state.shopping,old=new Map(sh.items.map(x=>[norm(x.name),x])),items=new Map();let nextOrder=Math.max(0,...sh.items.map(i=>Number(i.order)||0))+1;
 for(const o of sh.items){const manual=o.manual===true||(o.manual===undefined&&(!o.sources||!o.sources.length));if(!manual||sh.excluded.includes(norm(o.name)))continue;items.set(norm(o.name),{id:o.id||uid(),name:o.name,checked:!!o.checked,manual:true,manualQty:o.manualQty??o.qty??'',sources:[],sourceQtys:[],order:Number.isFinite(o.order)?o.order:nextOrder++})}
 for(const id of [...new Set(sh.recipeIds)]){const r=recipe(id);if(!r)continue;for(const ing of ingredientArray(r)){const k=norm(ing.name);if(!k||sh.excluded.includes(k))continue;let item=items.get(k);if(!item){const o=old.get(k);item={id:o?.id||uid(),name:ing.name,checked:!!o?.checked,manual:false,manualQty:'',sources:[],sourceQtys:[],order:Number.isFinite(o?.order)?o.order:nextOrder++};items.set(k,item)}if(!item.sources.includes(id))item.sources.push(id);if(ing.qty)item.sourceQtys.push(ing.qty)}}
 sh.recipeIds=sh.recipeIds.filter((v,i,a)=>recipe(v)&&a.indexOf(v)===i);sh.items=[...items.values()].map(x=>({...x,qty:combineQuantities([x.manual?x.manualQty:'',...x.sourceQtys])}));}
function addSources(ids){const sh=state.shopping;for(const id of ids){const r=recipe(id);if(!r)continue;if(!sh.recipeIds.includes(id))sh.recipeIds.push(id);const names=new Set(ingredientArray(r).map(x=>norm(x.name)));sh.excluded=sh.excluded.filter(x=>!names.has(x))}rebuildShopping();commit('Ingrédients ajoutés à votre liste de courses.')}
function addManual(){const name=$('#shop-name').value.trim(),qty=$('#shop-qty').value.trim();if(!name)return;const sh=state.shopping,k=norm(name);sh.excluded=sh.excluded.filter(x=>x!==k);let item=sh.items.find(x=>norm(x.name)===k);if(item){item.manual=true;item.manualQty=combineQuantities([item.manualQty,qty]);item.checked=false}else sh.items.push({id:uid(),name,qty,checked:false,manual:true,manualQty:qty,order:Math.max(0,...sh.items.map(x=>Number(x.order)||0))+1,sources:[],sourceQtys:[]});rebuildShopping();commit('Article ajouté à la liste.')}
function shoppingRow(x){return `<div class="shopping-row ${x.checked?'checked':''}"><input type="checkbox" data-action="toggle-item" data-id="${e(x.id)}" ${x.checked?'checked':''} aria-label="${e(x.name)}"><span class="shopping-name">${e(x.name)}${x.qty?`<span class="shopping-qty">${e(x.qty)}</span>`:''}</span><button class="mini-action" data-action="delete-item" data-id="${e(x.id)}" title="Retirer l’article">✕</button></div>`}
function groupedShop(items){const a=[...items];if(shopSort==='name')a.sort((x,y)=>x.name.localeCompare(y.name,'fr'));else if(shopSort==='added')a.sort((x,y)=>(x.order||0)-(y.order||0));else a.sort((x,y)=>AISLES.indexOf(aisle(x.name))-AISLES.indexOf(aisle(y.name))||x.name.localeCompare(y.name,'fr'));
 if(shopSort!=='category')return `<div class="card">${a.map(shoppingRow).join('')}</div>`;
 return AISLES.map(cat=>{const sub=a.filter(i=>aisle(i.name)===cat);return sub.length?`<div class="aisle"><div class="aisle-label">${e(cat)} <small>(${sub.length})</small></div><div class="card">${sub.map(shoppingRow).join('')}</div></div>`:''}).join('')}
function renderShopping(){rebuildShopping();const sh=state.shopping,notDone=sh.items.filter(x=>!x.checked),done=sh.items.filter(x=>x.checked);$('#view').innerHTML=`<div class="section-head"><div><div class="eyebrow">Le panier</div><h2>Ma liste de courses</h2><p class="section-sub">Une liste regroupée, sans doublons et facile à partager.</p></div><div class="toolbar"><button class="btn btn-primary" data-action="shopping-pick">＋ Ajouter une recette</button><button class="btn btn-soft" data-action="shopping-week">＋ Semaine entière</button></div></div><div class="card form-card"><div class="form-inline"><input id="shop-name" aria-label="Nom de l’article" placeholder="Ajouter un article (ex. citron)…"><input id="shop-qty" aria-label="Quantité de l’article" placeholder="Quantité (facultatif)" style="max-width:190px"><button class="btn btn-primary" data-action="manual-item">＋ Ajouter</button></div></div><div class="section-head" style="margin:16px 0"><div><strong>${notDone.length} à acheter</strong> <small>· ${done.length} déjà pris</small></div><div class="shopping-actions"><select id="shopping-sort" class="btn" aria-label="Trier la liste"><option value="category" ${shopSort==='category'?'selected':''}>Rayons / catégories</option><option value="name" ${shopSort==='name'?'selected':''}>A → Z</option><option value="added" ${shopSort==='added'?'selected':''}>Ordre d’ajout</option></select><button class="btn btn-mini" data-action="clean-shop">🧹 Nettoyer</button></div></div>${sh.recipeIds.length?`<div class="chip-list" style="margin-bottom:16px">${sh.recipeIds.map(id=>recipe(id)).filter(Boolean).map(r=>`<span class="chip green">${e(r.title)} <button class="chip-close" data-action="remove-source" data-id="${e(r.id)}" title="Retirer cette recette de la liste">×</button></span>`).join('')}</div>`:''}<div class="shopping-section"><h3>☐ À acheter</h3>${notDone.length?groupedShop(notDone):empty('Votre liste est vide. Ajoutez une recette ou un article.','🛒')}</div>${done.length?`<div class="shopping-section"><h3>☑ Déjà pris</h3>${groupedShop(done)}</div>`:''}<div class="toolbar" style="margin-top:22px"><button class="btn" data-action="print-shop">🖨️ Imprimer</button><button class="btn" data-action="mail-shop">✉️ Envoyer par mail</button><button class="btn" data-action="share-shop">📱 Partager</button></div>`}
function shopText(){const notDone=state.shopping.items.filter(x=>!x.checked),done=state.shopping.items.filter(x=>x.checked);const lines=(a)=>AISLES.map(cat=>{const s=a.filter(x=>aisle(x.name)===cat).sort((x,y)=>x.name.localeCompare(y.name,'fr'));return s.length?`${cat}\n${s.map(x=>`  ${x.checked?'☑':'☐'} ${x.name}${x.qty?` — ${x.qty}`:''}`).join('\n')}`:''}).filter(Boolean).join('\n\n');return `Ma liste de courses\n\n☐ À acheter\n${lines(notDone)||'(aucun article)'}\n\n☑ Déjà pris\n${lines(done)||'(aucun article)'}`}
function printShopping(){const list=(a)=>AISLES.map(cat=>{const group=a.filter(x=>aisle(x.name)===cat);return group.length?`<h3>${e(cat)}</h3>${group.map(x=>`<div class="print-line ${x.checked?'checked':''}">${x.checked?'☑':'☐'} ${e(x.name)} ${e(x.qty||'')}</div>`).join('')}`:''}).join('');$('#print-area').innerHTML=`<h1>🛒 Ma liste de courses</h1><p>${e(new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}))}</p><h2>☐ À acheter</h2>${list(state.shopping.items.filter(x=>!x.checked))}<h2>☑ Déjà pris</h2>${list(state.shopping.items.filter(x=>x.checked))}`;window.print()}
async function shareShopping(){const body=shopText();if(navigator.share){try{await navigator.share({title:'Ma liste de courses',text:body});return}catch(err){if(err.name==='AbortError')return}}try{await navigator.clipboard.writeText(body);toast('Liste copiée dans le presse-papiers.')}catch{const a=document.createElement('textarea');a.value=body;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('Liste copiée.') }}
function usage(){const past=new Map(),future=new Map(),t=today();for(const [day,slots] of Object.entries(state.planning)){for(const s of ['midi','soir']){const r=recipe(slots[s]);if(!r)continue;const names=new Set();for(const ing of ingredientArray(r)){const key=norm(ing.name);if(!key||names.has(key))continue;names.add(key);const target=day<t?past:future;target.has(key)||target.set(key,{name:ing.name,dates:[],recipeNames:new Set()});const x=target.get(key);x.dates.push(day);x.recipeNames.add(r.title)}}}return {past,future}}
function ageBadge(days){return `<span class="age-badge ${days<=2?'red':days<=7?'amber':'green'}">${days===0?'Aujourd’hui':`${days} j`}</span>`}
function renderHistory(){const {past,future}=usage(),t=today();const pastEntries=[...past.values()].map(x=>({...x,last:x.dates.sort().at(-1)})).sort((a,b)=>b.last.localeCompare(a.last)||a.name.localeCompare(b.name,'fr'));const coming=[...future.values()].map(x=>({...x,next:x.dates.sort()[0]})).sort((a,b)=>a.next.localeCompare(b.next)||a.name.localeCompare(b.name,'fr'));$('#view').innerHTML=`<div class="section-head"><div><div class="eyebrow">Les habitudes</div><h2>Ingrédients</h2><p class="section-sub">Retrouvez ce que vous avez mangé et ce qui arrive.</p></div></div><div class="info-grid"><section class="card info-panel"><h3>🕰️ Quand ai-je mangé… ?</h3><p class="muted">Basé sur les repas planifiés avant aujourd’hui.</p><input class="searchbar" id="ingredient-search" type="search" placeholder="Chercher un ingrédient…" value="${e(ingredientQuery)}" style="width:100%;margin-bottom:14px"><div id="past-list"></div></section><section class="card info-panel"><h3>📆 Ingrédients à venir</h3><p class="muted">Repas prévus à partir d’aujourd’hui.</p>${coming.length?`<div class="history-grid">${coming.map(x=>`<div class="history-card card"><div><h3>${e(x.name)}</h3><small>Prochain : ${e(fmt(x.next,{weekday:'short',day:'numeric',month:'long'}))}<br>${e([...x.recipeNames].join(', '))}</small></div></div>`).join('')}</div>`:empty('Aucun repas futur enregistré.','📅')}</section></div>`;function filterPast(){const filtered=pastEntries.filter(x=>norm(x.name).includes(norm(ingredientQuery)));$('#past-list').innerHTML=filtered.length?`<div class="history-grid">${filtered.map(x=>{const days=dateDays(x.last,t);return `<article class="history-card card"><div><h3>${e(x.name)}</h3><small>Dernière fois : ${e(fmt(x.last,{day:'numeric',month:'long',year:'numeric'}))}<br>${e([...x.recipeNames].join(', '))}</small></div>${ageBadge(days)}</article>`}).join('')}</div>`:empty(pastEntries.length?'Aucun ingrédient correspondant.':'Pas encore de repas passés dans votre planning.','🥕')}
 filterPast();$('#ingredient-search').addEventListener('input',ev=>{ingredientQuery=ev.target.value;filterPast()})}
function lastRecipeDay(id){let found='';for(const [day,pl] of Object.entries(state.planning))if(day<today()&&(pl.midi===id||pl.soir===id)&&day>found)found=day;return found}
function renderSuggestions(){const scores=state.recipes.map(r=>{const last=lastRecipeDay(r.id),days=last?Math.min(30,dateDays(last,today())):30;return {r,last,days,score:(Number(r.favorite)||0)*5+days}}).sort((a,b)=>b.score-a.score||(Number(b.r.favorite)||0)-(Number(a.r.favorite)||0)||a.r.title.localeCompare(b.r.title,'fr')).slice(0,6);$('#view').innerHTML=`<div class="section-head"><div><div class="eyebrow">À redécouvrir</div><h2>Suggestions du chef</h2><p class="section-sub">Le classement valorise vos favoris et les recettes cuisinées il y a longtemps.</p></div></div><div class="stat-row"><span class="stat-pill">Score = étoiles × 5 + jours depuis le dernier repas (max. 30)</span></div>${scores.length?`<div class="suggest-grid">${scores.map(({r,last,days,score},i)=>`<article class="card recipe-card rank-card"><div style="position:relative">${photo(r)}<span class="rank">${i+1}</span></div><div class="recipe-body"><button class="title-link" data-action="detail" data-id="${e(r.id)}">${e(r.title)}</button>${badges(r)}<div class="badge-row"><span class="tag">${last?`Dernière fois : ${days} jour${days>1?'s':''}`:'Jamais planifiée'}</span><span class="tag">Score ${score}</span></div>${chipList(ingredientArray(r),8)}<div class="recipe-footer"><button class="btn btn-mini btn-primary" data-action="suggest-slot" data-id="${e(r.id)}" data-slot="midi">☀️ Midi aujourd’hui</button><button class="btn btn-mini btn-primary" data-action="suggest-slot" data-id="${e(r.id)}" data-slot="soir">🌙 Soir aujourd’hui</button></div></div></article>`).join('')}</div>`:empty('Ajoutez quelques recettes pour obtenir des suggestions.','✨')}`}
function exportJson(){const out={_comment:'Mon Menu de la Semaine — export de l’application',version:4,updatedAt:state.updatedAt,recipes:state.recipes,plan:state.planning,planning:state.planning,shopping:state.shopping};const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='donnees-menu-semaine.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Sauvegarde JSON téléchargée. Déposez-la sur Drive pour la partager.')}
function importJson(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(String(reader.result));if(!Array.isArray(d.recipes))throw Error('invalid');if(!confirm(`Importer ${d.recipes.length} recettes ? Vos recettes, votre planning et votre liste actuels seront remplacés par les données du fichier. Pensez à exporter une sauvegarde avant.`))return;state=hydrate(d);rebuildShopping();commit(`${state.recipes.length} recettes importées.`)}catch{toast('Fichier invalide : JSON attendu avec une liste « recipes ».')}};reader.readAsText(file,'utf-8')}
function handleAction(b){const a=b.dataset.action,id=b.dataset.id,day=b.dataset.date,slot=b.dataset.slot;
 if(a==='prev-week'){weekOffset--;renderWeek()}else if(a==='next-week'){weekOffset++;renderWeek()}else if(a==='today-week'){weekOffset=0;renderWeek()}
 else if(a==='pick-plan'){recipeSelector(`${b.dataset.mode==='insert'?'Insérer':'Choisir'} une recette · ${slot} · ${fmt(day)}`,rid=>setPlan(day,slot,rid,b.dataset.mode==='insert'))}
 else if(a==='clear-plan')clearPlan(day,slot);
 else if(a==='detail')detail(id);else if(a==='new-recipe')editor();else if(a==='edit-recipe')editor(id);else if(a==='save-recipe')saveRecipe(id||null);else if(a==='delete-recipe')deleteRecipe(id);
 else if(a==='modal-close')closeModal();else if(a==='selected-recipe'){const cb=modalSelection;closeModal();if(cb)cb(id)}
 else if(a==='clear-recipe-search'){query='';renderRecipes()}
 else if(a==='shopping-pick')recipeSelector('Ajouter une recette aux courses',rid=>addSources([rid]));
 else if(a==='shopping-week'){const base=weekBase(),end=shiftDate(base,6),ids=[...new Set(Object.entries(state.planning).filter(([d])=>d>=base&&d<=end).flatMap(([,pl])=>[pl.midi,pl.soir]).filter(Boolean))];if(!ids.length)toast('Aucun repas planifié sur cette semaine.');else addSources(ids)}
 else if(a==='manual-item')addManual();else if(a==='remove-source'){state.shopping.recipeIds=state.shopping.recipeIds.filter(v=>v!==id);rebuildShopping();commit('Recette retirée de la liste.')}else if(a==='delete-item'){const x=state.shopping.items.find(x=>x.id===id);if(x){state.shopping.items=state.shopping.items.filter(v=>v.id!==id);if(x.sources?.length)state.shopping.excluded.push(norm(x.name));rebuildShopping();commit('Article retiré.')}}
 else if(a==='clean-shop'){const n=state.shopping.items.filter(x=>x.checked);if(!n.length)return toast('Aucun article coché.');state.shopping.items=state.shopping.items.filter(x=>!x.checked);state.shopping.excluded.push(...n.filter(x=>x.sources?.length).map(x=>norm(x.name)));rebuildShopping();commit(`${n.length} article(s) nettoyé(s).`)}
 else if(a==='print-shop')printShopping();else if(a==='mail-shop'){location.href=`mailto:?subject=${encodeURIComponent('Ma liste de courses')}&body=${encodeURIComponent(shopText())}`}
 else if(a==='drive-login')driveRequestToken();else if(a==='share-shop')shareShopping();else if(a==='export-json')exportJson();else if(a==='import-json')$('#json-file').click();
 else if(a==='suggest-slot'){const d=today();if(state.planning[d]?.[slot]&&!confirm(`Remplacer le repas déjà prévu pour ${slot} aujourd’hui ?`))return;setPlan(d,slot,id);tab='week';weekOffset=0;render()}}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(b){if(b.matches('input[type=checkbox]'))return;ev.preventDefault();handleAction(b);return}if(ev.target.classList.contains('modal-wrap'))closeModal();const t=ev.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render();$('#view').focus({preventScroll:true})}});
document.addEventListener('change',ev=>{if(ev.target.id==='shopping-sort'){shopSort=ev.target.value;renderShopping()}else if(ev.target.matches('[data-action="toggle-item"]')){const x=state.shopping.items.find(i=>i.id===ev.target.dataset.id);if(x){x.checked=ev.target.checked;commit(x.checked?'Article coché.':'Article décoché.')}}else if(ev.target.id==='json-file'){importJson(ev.target.files?.[0]);ev.target.value=''}});
document.addEventListener('input',ev=>{if(ev.target.id==='recipe-search'){query=ev.target.value;renderRecipeList()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&$('#modal-host').children.length)closeModal();if(ev.key==='Enter'&&(ev.target.id==='shop-name'||ev.target.id==='shop-qty')){ev.preventDefault();addManual()}});
let dragged='';document.addEventListener('dragstart',ev=>{const day=ev.target.closest('.day-card');if(!day)return;dragged=day.dataset.date;ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',dragged)});document.addEventListener('dragover',ev=>{const el=ev.target.closest('.day-card');if(!el||!dragged)return;ev.preventDefault();$$('.day-card').forEach(x=>x.classList.remove('drag-over'));if(el.dataset.date!==dragged)el.classList.add('drag-over')});document.addEventListener('drop',ev=>{const el=ev.target.closest('.day-card');if(!el||!dragged)return;ev.preventDefault();const dst=el.dataset.date;$$('.day-card').forEach(x=>x.classList.remove('drag-over'));const src=dragged;dragged='';swapDays(src,dst)});document.addEventListener('dragend',()=>{dragged='';$$('.day-card').forEach(x=>x.classList.remove('drag-over'))});
window.addEventListener('error',ev=>{if(ev.target?.classList?.contains('recipe-img'))ev.target.style.display='none'},true);
rebuildShopping();render();
})();
</script>
